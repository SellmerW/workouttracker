<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>WorkoutTracker</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WorkoutTracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png?v=1">
<style>
:root{--bg:#f6f7f7;--c:#fff;--t:#1c2124;--m:#7b858a;--a:#39f06f;--ao:#06140b;--wo:.16;--at:color-mix(in srgb,var(--a) 55%,#000);--l:#e3e7e8}
@media(prefers-color-scheme:dark){:root{--bg:#111415;--c:#1b1f21;--t:#eceff0;--m:#8a9499;--at:var(--a);--l:#2a3033;--wo:.8}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t);font:15px -apple-system,system-ui,sans-serif;touch-action:pan-x pan-y}
#v{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 14px calc(100px + env(safe-area-inset-bottom))}
#hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:18px}
#hd button{border:0;background:none;color:var(--m);padding:6px 8px;font-size:20px;margin:0;display:inline-flex}
#hd button:first-child:not(:only-child){font-size:15px}
#tb{position:fixed;left:0;bottom:0;height:3px;width:0;background:var(--a);z-index:9;pointer-events:none}
button,select,input,textarea{font:inherit;color:var(--t)}
button{background:var(--c);border:1px solid var(--l);border-radius:999px;padding:8px 14px;margin:2px 0}
button.p{background:var(--a);border-color:var(--a);color:var(--ao);box-shadow:0 0 14px color-mix(in srgb,var(--a) 35%,transparent)}
input,select,textarea{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:8px 10px;min-width:0}
input[type=checkbox]{width:auto}
textarea{width:100%;margin-top:6px;height:44px}
.card{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:14px;margin:10px 0}
.m,small{color:var(--m);font-size:13px}
.row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.row input:not([type=checkbox]):not(.n){flex:1}
.n{width:64px}
.seg{display:flex;margin-bottom:10px;background:var(--l);padding:3px;border-radius:999px}.seg button{flex:1;border:0;background:none;margin:0;color:var(--m)}.seg button.on{background:var(--c);color:var(--t);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.set{display:flex;gap:6px;align-items:center;margin:6px 0}.set input{width:30%;flex:1}.set span{width:14px;color:var(--m)}
.set i{width:54px;font-style:normal;color:var(--at);font-size:12px;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.d small{font-size:9px;color:inherit;opacity:.85}.d{flex-direction:column;line-height:1.15;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;font-weight:400}.d.pl{border:1.5px dashed var(--a);color:var(--at)}.d.td{background:var(--l);font-weight:700}.d.on{background:var(--a);color:var(--ao)}.d.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--t)}.gr{stroke:var(--l);stroke-width:1}.ax{stroke:var(--m);stroke-width:1;opacity:.5}
.bars{display:flex;gap:6px;align-items:flex-end;height:140px}.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center}
.bars u{width:100%;background:var(--a);border-radius:4px 4px 0 0;min-height:1px}
.bar{height:8px;background:var(--a);border-radius:4px}
.eq{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:8px 0}
.ln{fill:none;stroke:var(--a);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.dt{fill:var(--a)}svg text{fill:var(--m)}.fl{display:inline-flex;align-items:center;gap:2px;color:var(--at);font-size:16px;font-weight:600;margin-right:6px}.fl.z{color:var(--m)}#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--t);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom);z-index:5}
#nav button{flex:1;border:0;background:none;border-radius:0;margin:0;padding:9px 0 7px;color:var(--m);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
#nav .on{color:var(--at);font-weight:600}
.big{font-size:30px;font-weight:700}.big2{font-size:26px;display:block;margin:6px 0}.big3{font-size:26px;font-weight:700;color:var(--t)}.big3 small{font-size:14px;margin-left:3px}
.hero{border-color:var(--a);box-shadow:0 8px 28px color-mix(in srgb,var(--a) 22%,transparent);padding:18px;position:relative;overflow:hidden}.hero>*{position:relative}.hero>.wp{position:absolute;right:12px;top:24px;width:90px;height:90px;color:#000;opacity:var(--wo);pointer-events:none}.hero>.wp.sm{width:70px;height:70px;top:14px}.wide{width:100%;padding:14px;font-size:17px;font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{position:relative;overflow:hidden;margin:0;min-height:132px}.dl{font-size:13px;margin-top:4px;position:relative}
.ti{width:26px;height:26px;color:var(--t);fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block;margin-bottom:6px}.sp{position:absolute;right:0;bottom:0;width:55%;height:46%}
.bars2{display:flex;gap:3px;align-items:flex-end;height:120px}.bars2 div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}.bars2 u{width:100%;max-width:14px;background:var(--a);border-radius:4px 4px 0 0}.bars2 small{font-size:9px;height:12px}
</style></head><body>
<div id="v"></div><div id="tb"></div><div id="toast"></div><div id="nav"></div>
<script>
const K='workout-v1';
// namen uit de vorige versie (alleen voor het omzetten van oude gegevens)
const OLD='Bankdrukken|Halter bankdrukken|Incline halterpers|Halter flyes|Push-ups|Chest press machine|Kabel flyes|Optrekken|Lat pulldown|Roeien met barbell|Halter roeien|Zittend kabel roeien|Deadlift|Face pull|Schouderpers met halters|Overhead press|Zijwaarts heffen|Reverse fly|Biceps curl|Barbell curl|Hammer curl|Triceps pushdown|Skullcrushers|Overhead triceps extension|Kniebuigen|Goblet squat|Beenpers|Leg extension|Leg curl|Lunges|Roemeense deadlift|Hip thrust|Kuitheffen|Plank|Crunch|Hanging knee raise|Cable crunch'.split('|');
const OLDBW=['Push-ups','Optrekken','Kuitheffen','Hanging knee raise'];
var S,V='t',sub='k',st='c',mo=0,mo2=0,pv='t',ed=null,sx={},T=0;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const key=n=>String(n||'').trim().toLowerCase();
var sd=ds(new Date());
function norm(o){o=Object.assign({routines:[],log:[],cur:null,set:{}},o||{});o.set=Object.assign({rest:90,bw:''},o.set);o.plan=Object.assign({d:[0,2,4],g:1,r:[],i:0,m:'dyn'},o.plan);o.routines.forEach((r,k)=>{if(!r.id)r.id='r'+Date.now().toString(36)+k});
 const cu=o.custom||[],nm=id=>/^e\d+$/.test(id)?(OLD[+id.slice(1)]||id):((cu.find(x=>x.id==id)||{}).nl||id),fx=e=>{if(!e.n){e.n=nm(e.id);delete e.id}};
 o.routines.forEach(r=>r.ex.forEach(fx));o.log.forEach(l=>l.ex.forEach(fx));if(o.cur)o.cur.ex.forEach(fx);
 if(!o.bwk){o.bwk={};OLDBW.forEach(n=>o.bwk[key(n)]=true)}delete o.custom;return o}
function theme(){const c=/^#[0-9a-f]{6}$/i.test(S.set.ac||'')?S.set.ac:'#39f06f',n=i=>parseInt(c.slice(i,i+2),16),L=(.299*n(1)+.587*n(3)+.114*n(5))/255,s=document.documentElement.style;s.setProperty('--a',c);s.setProperty('--ao',L>.55?'#06140b':'#fff')}
const AC=['#39f06f','#3ab7ff','#b26bff','#ff9a3c','#ff4fa3','#e6ff3a'];
function sac(c){S.set.ac=c;save();theme();R()}
function load(){let o;try{o=JSON.parse(localStorage.getItem(K))}catch(e){}S=norm(o);theme()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const G=()=>S.gyms[S.gym]||S.gyms[0];
const vol=(e,s)=>((+s.kg||0)+(S.bwk[key(e.n)]?(+S.set.bw||0):0))*(+s.r||0);
const e1=(k,r)=>k>0&&r>0?(r==1?k:k*(1+r/30)):0;
function prev(n){const k=key(n);for(let i=S.log.length-1;i>=0;i--){const e=S.log[i].ex.find(e=>key(e.n)==k);if(e&&e.sets.length)return e.sets}return null}
function best(n){const q=key(n);let k=0,e=0;S.log.forEach(l=>l.ex.forEach(x=>{if(key(x.n)==q)x.sets.forEach(s=>{k=Math.max(k,+s.kg||0);e=Math.max(e,e1(+s.kg,+s.r))})}));return{k,e}}
function pr(n,s){const b=best(n);if(!b.k)return'';const k=+s.kg,r=+s.r;if(k>b.k)return'PR';if(e1(k,r)>b.e+.01)return'PR 1RM';return''}
function names(){const m={};S.routines.forEach(r=>r.ex.forEach(e=>e.n&&(m[key(e.n)]=e.n)));S.log.forEach(l=>l.ex.forEach(e=>m[key(e.n)]=e.n));return Object.values(m)}
const FL='<svg width=18 height=18 viewBox="0 0 24 24" fill=currentColor><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-2.5 1.2-4 2.5-5 .3 2 1 3 2 3.2C11.500 8 10.800 5 12 2z"/></svg>';
const IC='<svg width=22 height=22 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round><path d="M5 20V11M12 20V4M19 20v-6"/></svg>';
const rn=r=>{const n=(r.n||'').trim();return !n?'Hardlooptraining':/training$/i.test(n)?n:n+' training'};
const TB=[['t','Home','<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'],['s','Voortgang','<path d="M5 20V11M12 20V4M19 20v-6"/>'],['w','Training','<path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/>'],['i','Profiel','<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>']];
function nv(v){if(['t','s','w','i'].includes(V))pv=V;V=v;R();window.scrollTo(0,0)}
function R(){
 if(V!='i')sx.p=0;
 const sb=V=='p'||V=='h',hh=new Date().getHours(),gt=hh<12?'Goedemorgen':hh<18?'Goedemiddag':'Goedenavond',sk=streak();
 const hd=V=='t'?`<div id=hd><div>${S.set.nm?`<div class=m>${gt},</div>`:''}<div class=big>${S.set.nm?esc(S.set.nm):gt}</div></div><span class="fl ${sk?'':'z'}">${FL}${sk}</span></div>`:`<div id=hd>${sb?`<button onclick="V=pv;R()">‹ Terug</button>`:''}<b class=${sb?'':'big'}>${{s:'Voortgang',w:'Training',i:'Profiel',p:'Schema',h:'Hardloopschema'}[V]}</b>${sb?'<span style="width:60px"></span>':''}</div>`;
 $('#v').innerHTML=hd+(V=='t'?vT():V=='s'?vS():V=='w'?vW():V=='p'?vP():V=='h'?vH():vI())+`<datalist id=dl>${names().map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`;
 const act=['t','s','w','i'].includes(V)?V:pv;
 $('#nav').innerHTML=TB.map(([k,l,d])=>`<button class="${act==k?'on':''}" onclick="ed=null;V='${k}';R();window.scrollTo(0,0)"><svg width=24 height=24 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round>${d}</svg>${l}</button>`).join('');
}
/* HOME */
function mins(l){return l.c?(+l.c.min||0):(l.m||l.ex.reduce((a,e)=>a+e.sets.length,0)*3)}
const lv=l=>l.ex.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+vol(e,s),0),0);
function est(r){if(r.run){const m=(r.note||'').match(/± (\d+) min/);return m?+m[1]:0}
 if(r.t=='c'){const c=lastC(r.id);return c?+c.min||0:0}
 const a=S.log.filter(l=>l.rid==r.id&&l.m).map(l=>l.m);return a.length?Math.round(a.reduce((x,y)=>x+y)/a.length):r.ex.reduce((x,e)=>x+e.sets,0)*3}
const WP=(c,sm)=>`<svg class="wp${sm?' sm':''}" viewBox="0 0 100 100" aria-hidden=true>${c?'<g transform="translate(-4,-6) scale(4.4)" fill="currentColor"><path d="M2.5 16 C2.5 14.6 3.4 13.6 4.8 13.2 L8.6 12.2 C9.6 11.9 10.4 11.2 10.9 10.3 L12 7.6 C12.2 7 12.9 6.7 13.5 7 L14.3 7.5 C15 8 15.6 8.5 16.5 8.6 L19.4 6 L21.2 6.6 C21.5 8 21.5 10.5 21.5 12 V16 Z"/><rect x="2.5" y="16.6" width="19" height="2.6" rx="1.2"/></g>':'<g transform="rotate(-35 50 50)" fill="currentColor"><rect x="8" y="30" width="10" height="40" rx="3"/><rect x="20" y="22" width="12" height="56" rx="3"/><rect x="32" y="46" width="36" height="8" rx="2"/><rect x="68" y="22" width="12" height="56" rx="3"/><rect x="82" y="30" width="10" height="40" rx="3"/></g>'}</svg>`;
function nx(){
 if(S.cur)return `<div class="card hero">${WP(S.cur.t=='c',1)}<div class=m>Training bezig</div><b class=big2>${esc(S.cur.rt)}</b><button class="p wide" onclick="V='w';R()">Hervat</button></div>`;
 const s=sched(2);
 if(!s.length)return `<div class="card hero"><div class=m>Je volgende training</div><b class=big2>Nog geen schema</b><button class="p wide" onclick="${S.routines.length||S.rp?"nv('p')":"V='w';R()"}">${S.routines.length||S.rp?'Schema instellen':'Maak je eerste routine'}</button></div>`;
 const f=s[0],r=f.r,ty=r.run?'Hardlopen':r.t=='c'?'Cardio':'Kracht',dm=est(r);
 return `<div class="card hero">${WP(r.run||r.t=='c')}<div class=row style="margin:0"><span class=m style="flex:1">Je volgende training</span><span class=m>${wl(f.d)}</span></div><b class=big2>${esc(r.n)}</b><div class=m style="margin-bottom:12px">${ty}${dm?` · ≈ ${dm} min`:''}${r.ex&&r.ex.length?` · ${r.ex.length} oefeningen`:''}</div><button class="p wide" onclick="${r.run?'gr()':'go('+S.routines.indexOf(r)+')'}">Start training</button>${s[1]?`<div class=m style="margin-top:10px">Daarna: ${esc(s[1].r.n)} · ${wl(s[1].d)}</div>`:''}<div class=row><button onclick="V='w';R()">Andere training</button><button onclick="nv('p')">Schema</button><button onclick="V='s';st='p';R()">Planning</button></div></div>`}
function sp(a){const n=a.length,P=a.map((v,i)=>[i*100/(n-1),36-v/Math.max(1e-9,...a)*30]),f=x=>x.toFixed(1),cl=y=>Math.min(38,Math.max(2,y));
 let L='M'+f(P[0][0])+' '+f(P[0][1]);
 for(let i=0;i<n-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;
  L+='C'+f(p1[0]+(p2[0]-p0[0])/6)+' '+f(cl(p1[1]+(p2[1]-p0[1])/6))+' '+f(p2[0]-(p3[0]-p1[0])/6)+' '+f(cl(p2[1]-(p3[1]-p1[1])/6))+' '+f(p2[0])+' '+f(p2[1])}
 return `<svg class=sp viewBox="0 0 100 40" preserveAspectRatio="none"><path d="${L}L100 40L0 40Z" fill="currentColor" opacity=".15"/><path d="${L}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`}
function qs(){
 const n=new Date(),ym=x=>x.getFullYear()*12+x.getMonth(),cm=ym(n),w0=mon(n),nf=x=>x.toLocaleString('nl-NL',{maximumFractionDigits:1});
 const M=[['Krachttraining','',l=>l.c?0:1,'var(--a)',x=>nf(x),'<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>'],['Cardio','km',l=>l.c?+l.c.km||0:0,'#3ab7ff',x=>nf(x),'<path d="M2.5 16 C2.5 14.6 3.4 13.6 4.8 13.2 L8.6 12.2 C9.6 11.9 10.4 11.2 10.9 10.3 L12 7.6 C12.2 7 12.9 6.7 13.5 7 L14.3 7.5 C15 8 15.6 8.5 16.5 8.6 L19.4 6 L21.2 6.6 C21.5 8 21.5 10.5 21.5 12 V16 Z"/><rect x="2.5" y="16" width="19" height="2.6" rx="1.2"/><path d="M9.6 11.2L11.4 12M10.6 9.4L12.4 10.2"/>'],['Trainingstijd','u',mins,'#b26bff',x=>nf(x/60),'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],['Volume','kg',lv,'#ff9a3c',x=>Math.round(x).toLocaleString('nl-NL'),'<path d="M9 9V7a3 3 0 0 1 6 0v2"/><circle cx="12" cy="15" r="6"/>']];
 return `<div class=g2>`+M.map(([lb,un,f,c,fm,ic])=>{
  const sum=o=>S.log.reduce((a,l)=>ym(new Date(l.d+'T12:00'))==cm-o?a+f(l):a,0),cur=sum(0),pr=sum(1),wk=Array(8).fill(0);
  S.log.forEach(l=>{const i=7-Math.round((w0-mon(new Date(l.d+'T12:00')))/6048e5);if(i>=0&&i<8)wk[i]+=f(l)});
  const p=pr>0?Math.round((cur-pr)/pr*100):null;
  return `<div class="card tile" style="color:${c}"><svg class=ti viewBox="0 0 24 24">${ic}</svg><div class=big3>${fm(cur)}<small>${un}</small></div><div class=m>${lb} deze maand</div>${p==null?'':`<div class=dl>${p>=0?'↑':'↓'} ${Math.abs(p)}%</div>`}${sp(wk)}</div>`}).join('')+`</div>`}
function ac(){
 const m=sx.ar||'m',t=new Date();t.setHours(12,0,0,0);let it=[];const day={};S.log.forEach(l=>day[l.d]=(day[l.d]||0)+mins(l));
 if(m=='w'){for(let i=6;i>=0;i--){const d=new Date(t);d.setDate(d.getDate()-i);it.push({l:d.toLocaleDateString('nl-NL',{weekday:'narrow'}),v:day[ds(d)]||0})}}
 else if(m=='m'){const y=t.getFullYear(),mo=t.getMonth(),n=new Date(y,mo+1,0).getDate();for(let i=1;i<=n;i++)it.push({l:(i==1||i%5==0)?i:'',v:day[ds(new Date(y,mo,i))]||0})}
 else{const w0=mon(t);for(let i=12;i>=0;i--){const w=new Date(w0);w.setDate(w.getDate()-7*i);const k=ds(w);let v=0;S.log.forEach(l=>{if(ds(mon(new Date(l.d+'T12:00')))==k)v+=mins(l)});it.push({l:i%4==0?w.getDate()+'/'+(w.getMonth()+1):'',v})}}
 const mx=Math.max(1,...it.map(z=>z.v));
 return `<div class=row><b style="flex:1;font-size:18px">Activiteit</b><select onchange="sx.ar=this.value;R()">${[['w','Deze week'],['m','Deze maand'],['q','3 maanden']].map(([k,l])=>`<option value=${k} ${m==k?'selected':''}>${l}</option>`).join('')}</select></div><div class=card style="margin-top:4px"><div class=bars2>${it.map(z=>`<div><u style="height:${Math.round(z.v/mx*90)+2}px"></u><small>${z.l}</small></div>`).join('')}</div><p class=m style="margin-bottom:0">Trainingsminuten per ${m=='q'?'week':'dag'}. Bij oudere krachttrainingen zonder tijd is dit geschat.</p></div>`}
function vT(){return nx()+`<div style="font-size:18px;font-weight:600;margin:18px 0 8px">Snel overzicht</div>`+qs()+`<div style="height:18px"></div>`+ac()}
/* TRAINING */
function vW(){
 if(S.cur)sub=S.cur.t=='c'?'c':'k';
 const seg=`<div class=seg><button class="${sub=='k'?'on':''}" onclick="sub='k';R()">Kracht</button><button class="${sub=='c'?'on':''}" onclick="sub='c';R()">Cardio</button></div>`;
 if(ed)return seg+vE();
 if(S.cur)return seg+vC();
 if(sub=='c')return seg+rc()+S.routines.map((r,i)=>r.t!='c'?'':`<div class=card><b>${esc(r.n)}</b><div class=m>Cardio</div><div class=row><button class=p onclick="go(${i})">Start</button><button onclick="edit(${i})">Wijzig</button><button onclick="cf('r${i}',()=>{S.routines.splice(${i},1);save()})">${cl('r'+i,'Verwijder')}</button></div></div>`).join('')+cu()+`<button class=p onclick="edit(-1,'c')">Nieuwe cardio</button>`;

function pm2(m){S.plan.m=m;save();R()}
function pd(i){const d=S.plan.d,k=d.indexOf(i);k<0?d.push(i):d.splice(k,1);d.sort();save();R()}
function tr2(id){const r=S.plan.r,k=r.indexOf(id);k<0?r.push(id):r.splice(k,1);save();R()}
/* CARDIO */
function lastC(id){for(let i=S.log.length-1;i>=0;i--)if(S.log[i].rid==id&&S.log[i].c)return S.log[i].c;return null}
function vK(){const c=S.cur.c,p=lastC(S.cur.rid)||{};
 return `<div class=card><b>${esc(S.cur.rt)}</b>${S.cur.rp?`<div class=m>Doel: ${esc(S.cur.tk)} km${S.cur.tn?' · '+esc(S.cur.tn):''}</div>`:''}${p.min?`<div class=m>Vorige keer: ${esc(p.min)} min${p.km?' · '+esc(p.km)+' km':''}</div>`:''}<div class=m>Duur (min) · afstand (km) · RPE</div><div class=set><input type=number inputmode=decimal placeholder="${esc(p.min||'min')}" value="${esc(c.min)}" oninput="uk('min',this.value)"><input type=number inputmode=decimal placeholder="${esc(S.cur.tk||p.km||'km')}" value="${esc(c.km)}" oninput="uk('km',this.value)"><input type=number inputmode=decimal placeholder="RPE" value="${esc(c.rpe)}" oninput="uk('rpe',this.value)"></div><textarea placeholder="Notitie" oninput="uk('note',this.value)">${esc(c.note)}</textarea></div><div class=row><button class=p onclick=finC()>Training opslaan</button><button onclick="cf('cur',()=>{S.cur=null;save()})">${cl('cur','Annuleren')}</button></div>`}
function uk(f,v){S.cur.c[f]=v;save()}
function finC(){const c=S.cur.c,w=S.cur.rp;if(!(+c.min>0)){tz('Vul de duur in.');return}
 S.log.push({d:ds(new Date()),rt:S.cur.rt,rid:S.cur.rid,t:'c',c:{min:c.min,km:c.km,rpe:c.rpe,note:c.note},ex:[],rp:w?1:0});if(w&&S.rp){S.rp.k=Math.min(S.rp.k+1,S.rp.list.length);regen(true)}S.cur=null;save();R()}
/* HARDLOOPSCHEMA */
function rc(){const r=S.rp;
 if(!r)return`<button onclick="S.rp={n:'',date:'',iv:3,k:0,list:[{km:5,note:''}],rest:2};save();nv('h')">Hardloopschema maken</button>`;
 const e=r.list[r.k];
 return `<div class=card><b>${esc(r.n||'Hardloopschema')}</b><div class=m>${r.k}/${r.list.length} gedaan${r.date?' · tot '+fd(r.date):''}${S.plan.rp?'':' · niet in schema'}</div>${e?`<div class=row>Volgende: <b>${esc(e.km)} km</b> <span class=m>${esc(e.note)}</span></div><div class=row><button class=p onclick=gr()>Start</button><button onclick="nv('h')">Wijzig</button>${S.plan.rp?'':`<button onclick="nv('p')">Schema</button>`}</div>`:`<div class=row><span class=m>Schema afgerond</span><button onclick="nv('h')">Wijzig</button></div>`}</div>`}
function gr(){const r=S.rp,e=r&&r.list[r.k];if(!e)return;V='w';S.cur={t0:Date.now(),rt:rn(r)+' · '+e.km+' km',rid:'run',t:'c',rp:1,tk:e.km,tn:e.note,c:{min:'',km:'',rpe:'',note:''},ex:[]};save();R()}
function vH(){const r=S.rp;if(!r)return'';
 return `<div class=card><input style="width:100%" placeholder="Naam (bijv. Halve marathon)" value="${esc(r.n)}" oninput="S.rp.n=this.value;save()"><div class=row>Doeldatum <input type=date value="${esc(r.date)}" onchange="S.rp.date=this.value;save();R()"></div><p class=m>${r.date?'De runs worden gelijkmatig verdeeld tot de doeldatum, tussen je andere trainingen door. De laatste run valt op je laatste trainingsdag voor de doeldatum (instelbaar bij Schema).':'Zonder doeldatum volgen de runs je rustdagen voor cardio (bij Schema of onder Cardio).'}</p></div>${vG()}<div class=card>${r.list.map((e,i)=>`<div class=row><span class=m style="width:22px">${i<r.k?'✓':i+1}</span><input class=n type=number inputmode=decimal value="${esc(e.km)}" oninput="S.rp.auto=0;S.rp.list[${i}].km=this.value;save()"><span class=m>km</span><input placeholder="notitie, bijv. 5×1 km interval" value="${esc(e.note)}" oninput="S.rp.auto=0;S.rp.list[${i}].note=this.value;save()"><button onclick="rl(${i})">✕</button></div>`).join('')}<div class=row><button onclick="ra(1)">+ Run</button></div><div class=row><input class=n type=number id=na value=5><span class=m>runs van</span><input class=n type=number id=nk value=5><span class=m>km</span><button onclick="ra()">Voeg toe</button></div></div>`+(sched(8).length?`<div class=card><div class=m>Komende trainingen</div>${sched(8).map(s=>`<div class=row><span style="flex:1">${wl(s.d)}</span><b>${esc(s.r.n)}</b></div>`).join('')}</div>`:'')+`<button onclick="cf('rp',()=>{S.rp=null;save();V=pv})">${cl('rp','Schema verwijderen')}</button>`}
function rl(i){const r=S.rp;r.auto=0;r.list.splice(i,1);if(i<r.k)r.k--;save();R()}
function ra(one){S.rp.auto=0;const r=S.rp,n=one?1:Math.max(1,Math.min(100,+$('#na').value||1)),k=one?(r.list.length?r.list[r.list.length-1].km:5):($('#nk').value||5);for(let i=0;i<n;i++)r.list.push({km:k,note:''});save();R()}
function cn(id,v){S.plan.n=S.plan.n||{};S.plan.n[id]=Math.max(1,Math.min(4,+v||1));save()}
function cu(){const a=sched(80).filter(x=>x.r.run||x.r.t=='c').slice(0,6);
 return `<div class=card><div class=row>Rustdagen tussen cardio <input class=n type=number min=0 max=14 value=${cgv()} onchange="cg(this.value)"></div>${a.length?`<div class=m>Komende cardio</div>`+a.map(s=>`<div class=row><span style="flex:1">${wl(s.d)}</span><b>${esc(s.r.n)}</b></div>`).join(''):'<p class=m>Vink cardio of je hardloopschema aan bij Schema om te plannen.</p>'}</div>`}
/* PLANNING */
function vO(){
 const d0=new Date();d0.setDate(1);d0.setMonth(d0.getMonth()+mo2);
 const y=d0.getFullYear(),m=d0.getMonth(),n=new Date(y,m+1,0).getDate(),off=(d0.getDay()+6)%7,done=new Set(S.log.map(l=>l.d)),pl={},td=ds(new Date()),rd=S.rp&&S.plan.rp&&S.rp.date;
 sched(150).forEach(q=>pl[ds(q.d)]=q.r);
 let c=['Ma','Di','Wo','Do','Vr','Za','Zo'].map(x=>`<i class=m>${x}</i>`).join('')+'<i></i>'.repeat(off),ls='';
 for(let i=1;i<=n;i++){const k=ds(new Date(y,m,i)),p=pl[k],L=p?(p.run?'H':p.t=='c'?'C':'K'):k==rd?'★':'',dn=new Date(y,m,i).toLocaleDateString('nl-NL',{weekday:'short',day:'numeric'});
  c+=`<b class="d ${done.has(k)?'on':''} ${k==td?'td':''} ${p&&!done.has(k)?'pl':''}">${i}<small>${L}</small></b>`;
  if(p)ls+=`<div class=row><span style="flex:1">${dn}</span><b>${esc(p.n)}</b></div>`;
  if(k==rd)ls+=`<div class=row><span style="flex:1">${dn}</span><b>★ Doeldatum</b></div>`}
 return `<div class=row><button onclick="mo2--;R()">‹</button><span style="flex:1;text-align:center">${d0.toLocaleDateString('nl-NL',{month:'long',year:'numeric'})}</span><button onclick="mo2++;R()">›</button></div><div class=cal>${c}</div><p class=m>K kracht · H hardlopen · C cardio · ★ doeldatum · gevuld = gedaan · streep = gepland</p>`+(ls?`<div class=card>${ls}</div>`:'<p class=m>Niets gepland in deze maand.</p>')}
/* SCHEMA GENEREREN */
function pt(s){s=String(s||'').trim().replace(',','.');if(!s)return 0;const a=s.split(':').map(Number);if(a.some(isNaN))return 0;return a.length==3?a[0]*3600+a[1]*60+a[2]:a.length==2?a[0]*60+a[1]:a[0]*60}
function pp(s){s=String(s||'').replace(',','.');const m=s.match(/^(\d+):(\d{1,2})$/);return m?+m[1]*60+ +m[2]:(parseFloat(s)>0?parseFloat(s)*60:360)}
const pf=s=>Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0');
function gen(g,W,L0,pos,off){off=off||0;
 const rpw=Math.max(2,Math.min(5,Math.round(+g.rpw)||3)),goal=+g.goal||10,p=pp(g.pace),r5=x=>Math.round(x*2)/2,out=[];
 let pk=goal<=5?6:goal<=10?11:goal<=21.2?19:goal<=30?26:32;const want=pk;
 const nb=Math.max(1,Math.min(16,W-2)),hold=Math.max(0,W-2-nb),lim=L0*Math.pow(1.12,nb);
 if(pk>lim)pk=Math.max(L0,lim);pk=r5(pk);
 const bd=+g.bd||5,bt=pt(g.bt),pc=bt?bt*Math.pow(goal/bd,1.06)/goal:0,ref=w=>pc?Math.max(p,pc*1.02*(1-.008*(off+w))):p;let T;
 const F={2:[['E',.5],['L',1]],3:[['E',.4],['Q',.55],['L',1]],4:[['E',.4],['Q',.55],['M',.7],['L',1]],5:[['E',.4],['Q',.55],['E',.4],['M',.7],['L',1]]}[rpw],cap={E:10,Q:13,M:18},ws=[];
 const add=(km,ty,txt)=>out.push({km,note:txt+' · ± '+Math.round(km*T[ty]/60)+' min (gem. '+pf(T[ty])+'/km)'});
 for(let w=0;w<W;w++){
  const rf=ref(w);T={E:rf+75,L:rf+75,I:rf+40,T:rf+30,F:rf+45,S:rf+90};
  const n0=out.length,fin=w==W-1,t1=W>2&&w==W-2;let L;
  if(t1)L=pk*.7;else if(fin)L=0;else if(W<3||w<hold)L=L0;else{const j=w-hold+1;L=L0+(pk-L0)*j/nb;if(j%4==0&&j<nb)L*=.75}
  L=r5(Math.max(3,L));const em=Math.min(6,Math.max(3,r5(pk*.3)));
  F.forEach(([ty,f],i)=>{
   if(fin){i<rpw-1?add(em,'E','Rustig'):add(3,'S','Shakeout, kort en rustig');return}
   const km=r5(Math.max(3,L*f));
   if(ty=='L'){let tx='Lange duurloop, rustig';if(goal>=10&&!t1&&w>=hold+Math.ceil(nb/2)&&(w-hold)%2==0)tx='Progressieve duurloop: laatste '+Math.max(2,Math.min(5,Math.round(km*.2)))+' km op ≈ '+pf(rf+10)+'/km';add(km,'L',tx)}
   else if(ty=='E')add(Math.min(cap.E,km),'E','Rustige duurloop');
   else if(ty=='M')add(Math.min(cap.M,km),'E','Rustige middellange duurloop');
   else{const q=w%3,k2=Math.min(cap.Q,Math.max(4,km));
    if(q==0)add(k2,'I','Interval: '+Math.min(10,4+Math.floor(w/2))+'× '+(goal<=5?400:800)+' m, 90 s rust (+ in- en uitlopen)');
    else if(q==1)add(k2,'T','Tempoloop: '+Math.min(35,15+w)+' min op tempo (+ in- en uitlopen)');
    else add(k2,'F','Fartlek: '+Math.min(10,6+Math.floor(w/2))+'× 1 min snel, 1 min rustig')}});
  ws.push(out.slice(n0).reduce((a,x)=>a+x.km,0))}
 const warn=[];if(pk<want)warn.push('Opbouw beperkt: je langste run komt uit op '+pk+' km (richtwaarde '+want+' km). Kies een latere datum of een kleiner doel.');if(W<6)warn.push('Korte voorbereiding.');if(goal>21.2&&rpw<4)warn.push('Voor een marathon zijn 4 of meer runs per week gebruikelijker.');if(pc&&p<pc*.97)warn.push('Je doeltempo ligt boven je huidige niveau. De trainingstempo\'s starten op je huidige niveau en groeien geleidelijk (hooguit ongeveer 1% per week).');
 return{list:out.slice(pos||0),warn:warn.join(' '),info:'Piekweek ≈ '+Math.round(Math.max(...ws))+' km · langste run '+Math.max(...out.map(x=>x.km))+' km'}}
function regen(force,init){const r=S.rp;if(!r||!r.gok||!r.auto||!r.date||!r.gen)return;
 const t=new Date();t.setHours(12,0,0,0);const td=ds(t);if(!force&&r.gd==td)return;if(!init&&r.k>=r.list.length)return;
 const E2=new Date(r.date+'T12:00');E2.setDate(E2.getDate()-(+r.rest||0));const days=Math.round((E2-t)/864e5);if(days<0)return;
 const W=Math.max(1,Math.round((days+1)/7)),c=new Date(t);c.setDate(c.getDate()-21);const cs=ds(c),rc=S.log.filter(l=>l.rp&&l.d>=cs).map(l=>+(l.c&&l.c.km)||0);
 const g=r.gen,rpw=Math.max(2,Math.min(5,Math.round(+g.rpw)||3)),res=gen(g,W,Math.max(3,rc.length?Math.max(...rc):+g.base||5),r.k%rpw,r.gs?Math.max(0,Math.floor((t-new Date(r.gs+'T12:00'))/6048e5)):0);
 r.list=r.list.slice(0,r.k).concat(res.list);r.warn=res.warn;r.info=res.info;r.gd=td;save()}
function gset(k,v){const r=S.rp;r.gen=r.gen||{rpw:3,goal:21.1,pace:'6:00',base:5,bd:5,bt:''};r.gen[k]=v;save()}
function gm(){const r=S.rp;if(!r.date){tz('Kies eerst een doeldatum.');return}
 const go=()=>{r.gen=r.gen||{rpw:3,goal:21.1,pace:'6:00',base:5,bd:5,bt:''};const g=r.gen;
  if(!r.n)r.n=+g.goal==21.1?'Halve marathon':+g.goal==42.2?'Marathon':g.goal+' km';
  r.k=0;r.list=[];r.gok=1;r.auto=1;r.gd='';r.gs=ds(new Date());S.plan.rp=true;regen(true,1);
  if(!r.list.length){r.list=[{km:5,note:''}];r.gok=0;tz('Doeldatum te dichtbij of al voorbij.')}save();R()};
 if(r.list.length>1||r.k>0)cf('gen',go);else go()}
function vG(){const r=S.rp,g=r.gen||{rpw:3,goal:21.1,pace:'6:00',base:5,bd:5,bt:''};
 return `<div class=card><div class=m>Schema genereren</div><div class=row>Doel <select onchange="gset('goal',this.value)">${[5,10,15,21.1,30,42.2].map(x=>`<option value=${x} ${+g.goal==x?'selected':''}>${x==21.1?'Halve marathon':x==42.2?'Marathon':x+' km'}</option>`).join('')}</select></div><div class=row>Runs per week <input class=n type=number min=2 max=5 value=${esc(g.rpw)} onchange="gset('rpw',this.value)"></div><div class=row>Doeltempo (min/km) <input class=n style="width:72px" value="${esc(g.pace)}" placeholder="6:00" onchange="gset('pace',this.value)"></div><div class=row>Snelste tijd <select onchange="gset('bd',this.value)">${[1,5,10,15,21.1,42.2].map(x=>`<option value=${x} ${(+g.bd||5)==x?'selected':''}>${x==21.1?'Halve marathon':x==42.2?'Marathon':x+' km'}</option>`).join('')}</select><input class=n style="width:84px" value="${esc(g.bt||'')}" placeholder="25:30" onchange="gset('bt',this.value)"></div><div class=row>Langste run nu (km) <input class=n type=number value=${esc(g.base)} onchange="gset('base',this.value)"></div><div class=row><button class=p onclick="gm()">${cl('gen','Genereer schema')}</button></div>${r.gok?`<label class=row><input type=checkbox ${r.auto?'checked':''} onchange="S.rp.auto=this.checked?1:0;if(this.checked)regen(true);save();R()"> Automatisch bijstellen</label>`:''}${r.info?`<p class=m>${esc(r.info)}</p>`:''}${r.warn?`<p class=m>${esc(r.warn)}</p>`:''}${!S.plan.cx&&S.plan.st!==false&&+g.rpw>=3?'<p class=m>Let op: met 3 of meer runs per week past krachttraining er alleen bij als je bij Schema "Cardio op rustdagen van kracht, en andersom" aanvinkt.</p>':''}<p class=m>Snelste tijd is optioneel (mm:ss of u:mm:ss). Trainingstempo's starten op dat niveau of iets daaronder, nooit erboven.</p><p class=m>Gebruikt de doeldatum en de laatste trainingsdag hierboven. Automatisch bijstellen herberekent de resterende runs als je dagen overslaat; handmatige wijzigingen in de lijst zetten het uit. Dit is een richtlijn, geen persoonlijk trainingsadvies. Tempo's zijn schattingen. Typ tempo als 6:30.</p></div>`}
/* RUSTTIMER */
function startT(){if(S.set.rest>0){T=Date.now()+S.set.rest*1000;tick()}}
function tick(){const r=T-Date.now();$('#tb').style.width=r>0&&S.set.rest>0?(r/(S.set.rest*1000)*100)+'%':'0'}
setInterval(tick,250);
['gesturestart','gesturechange','gestureend'].forEach(e=>document.addEventListener(e,ev=>ev.preventDefault()));
load();regen();R();
</script></body></html>
